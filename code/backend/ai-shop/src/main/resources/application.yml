spring:
  application:
    name: ai-shop
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/ai_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
  logging:
    level:
      com.sh.aishop.mapper: DEBUG

# JWT
jwt:
  secret: ${JWT_SECRET:your_jwt_secret_here}
  expiration: 604800000

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.sh.aishop.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.sh.aishop.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# Server
server:
  port: ${SERVER_PORT:18780}

# 文件上传配置
upload:
  enabled: true
  storage-type: local  # local / oss
  local:
    base-path: /uploads
    access-path: /api/file/
  oss:
    enabled: false
    endpoint: ""
    bucket: ""
    access-key: ""
    secret-key: ""
    domain: ""
  allowed-extensions:
    - jpg
    - jpeg
    - png
    - gif
  max-size: 10485760
