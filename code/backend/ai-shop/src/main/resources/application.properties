spring.application.name=ai-shop

# 数据库
spring.datasource.url=jdbc:mysql://localhost:3306/ai_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# JWT
jwt.secret=ai-shop-jwt-secret-key-2026-very-long-string-for-security
jwt.expiration=604800000  # 7天（毫秒），可配置

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.sh.aishop.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 服务器
server.port=18780
