<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风格D - 紧凑表格</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      background: #f7f8fc;
      color: #1a1a2e;
    }
    .nav {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 600;
    }
    .table {
      margin: 12px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    .table-header {
      display: flex;
      padding: 12px 14px;
      background: #fafafa;
      font-size: 11px;
      font-weight: 600;
      color: #8b8ba7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .col-user { flex: 1; }
    .col-role { width: 60px; text-align: center; }
    .col-status { width: 56px; text-align: center; }
    .col-action { width: 70px; text-align: right; }
    .row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #f5f5f5;
    }
    .row:last-child { border-bottom: none; }
    .user-cell {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .user-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .user-phone { font-size: 11px; color: #8b8ba7; }
    .role-cell { width: 60px; text-align: center; }
    .role-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .role-1 { background: #fef2f2; color: #ef4444; }
    .role-2 { background: #fef9c3; color: #ca8a04; }
    .role-3 { background: #dbeafe; color: #3b82f6; }
    .status-cell { width: 56px; text-align: center; }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .status-1 .status-dot { background: #faad14; }
    .status-2 .status-dot { background: #52c41a; }
    .status-3 .status-dot { background: #ff4d4f; }
    .status-text { font-size: 12px; }
    .status-1 .status-text { color: #faad14; }
    .status-2 .status-text { color: #52c41a; }
    .status-3 .status-text { color: #ff4d4f; }
    .action-cell { width: 70px; text-align: right; }
    .btn {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-warning { background: #fef3c7; color: #d97706; }
    .btn-success { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>
  <div class="nav">用户管理</div>

  <div class="table">
    <div class="table-header">
      <div class="col-user">用户</div>
      <div class="col-role">角色</div>
      <div class="col-status">状态</div>
      <div class="col-action">操作</div>
    </div>

    <div class="row">
      <div class="user-cell">
        <div class="avatar">张</div>
        <div>
          <div class="user-name">张伟</div>
          <div class="user-phone">138****1234</div>
        </div>
      </div>
      <div class="role-cell"><span class="role-tag role-1">管理员</span></div>
      <div class="status-cell status-2"><span class="status-dot"></span><span class="status-text">正常</span></div>
      <div class="action-cell"><button class="btn btn-primary">重置</button></div>
    </div>

    <div class="row">
      <div class="user-cell">
        <div class="avatar" style="background: linear-gradient(135deg, #f59e0b, #d97706);">李</div>
        <div>
          <div class="user-name">李娜</div>
          <div class="user-phone">139****5678</div>
        </div>
      </div>
      <div class="role-cell"><span class="role-tag role-2">店铺</span></div>
      <div class="status-cell status-2"><span class="status-dot"></span><span class="status-text">正常</span></div>
      <div class="action-cell"><button class="btn btn-warning">冻结</button></div>
    </div>

    <div class="row">
      <div class="user-cell">
        <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669);">王</div>
        <div>
          <div class="user-name">王芳</div>
          <div class="user-phone">137****9012</div>
        </div>
      </div>
      <div class="role-cell"><span class="role-tag role-3">用户</span></div>
      <div class="status-cell status-3"><span class="status-dot"></span><span class="status-text">冻结</span></div>
      <div class="action-cell"><button class="btn btn-success">解冻</button></div>
    </div>

    <div class="row">
      <div class="user-cell">
        <div class="avatar" style="background: linear-gradient(135deg, #ec4899, #db2777);">陈</div>
        <div>
          <div class="user-name">陈静</div>
          <div class="user-phone">136****3456</div>
        </div>
      </div>
      <div class="role-cell"><span class="role-tag role-3">用户</span></div>
      <div class="status-cell status-1"><span class="status-dot"></span><span class="status-text">待审</span></div>
      <div class="action-cell"><button class="btn btn-primary">重置</button></div>
    </div>
  </div>
</body>
</html>
