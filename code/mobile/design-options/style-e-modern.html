<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风格E - 头像卡片+操作栏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      background: #f7f8fc;
      color: #1a1a2e;
    }
    .nav {
      background: #fff;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .list { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }
    .card-admin::before { background: linear-gradient(90deg, #ef4444, #f97316); }
    .card-shop::before { background: linear-gradient(90deg, #f59e0b, #eab308); }
    .card-user::before { background: linear-gradient(90deg, #3b82f6, #6366f1); }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .info { flex: 1; }
    .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .name { font-size: 16px; font-weight: 600; }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: 600;
    }
    .badge-admin { background: linear-gradient(135deg, #fef2f2, #fee2e2); color: #ef4444; }
    .badge-shop { background: linear-gradient(135deg, #fefce8, #fef9c3); color: #ca8a04; }
    .badge-user { background: linear-gradient(135deg, #eff6ff, #dbeafe); color: #3b82f6; }
    .phone { font-size: 13px; color: #8b8ba7; }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .status-1 { background: #fef3c7; color: #d97706; }
    .status-2 { background: #dcfce7; color: #16a34a; }
    .status-3 { background: #fee2e2; color: #ef4444; }
    .divider { height: 1px; background: #f5f5f5; margin-bottom: 12px; }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .points { font-size: 13px; color: #666; }
    .points span { color: #6366f1; font-weight: 700; font-size: 15px; }
    .actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-outline { background: #f5f5f5; color: #666; }
    .btn-warning { background: #fef3c7; color: #d97706; }
    .btn-success { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>
  <div class="nav">用户管理</div>
  <div class="list">
    <div class="card card-admin">
      <div class="top">
        <div class="avatar">张</div>
        <div class="info">
          <div class="name-row">
            <span class="name">张伟</span>
            <span class="badge badge-admin">管理员</span>
          </div>
          <div class="phone">138****1234</div>
        </div>
        <span class="status-badge status-2">正常</span>
      </div>
      <div class="divider"></div>
      <div class="bottom">
        <div class="points">注册于 <span>2024-01-15</span></div>
        <div class="actions">
          <button class="btn btn-primary">重置密码</button>
        </div>
      </div>
    </div>

    <div class="card card-shop">
      <div class="top">
        <div class="avatar" style="background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">李</div>
        <div class="info">
          <div class="name-row">
            <span class="name">李娜</span>
            <span class="badge badge-shop">店铺</span>
          </div>
          <div class="phone">139****5678</div>
        </div>
        <span class="status-badge status-2">正常</span>
      </div>
      <div class="divider"></div>
      <div class="bottom">
        <div class="points">积分 <span>5200</span></div>
        <div class="actions">
          <button class="btn btn-warning">冻结</button>
          <button class="btn btn-outline">重置</button>
        </div>
      </div>
    </div>

    <div class="card card-user">
      <div class="top">
        <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">王</div>
        <div class="info">
          <div class="name-row">
            <span class="name">王芳</span>
            <span class="badge badge-user">用户</span>
          </div>
          <div class="phone">137****9012</div>
        </div>
        <span class="status-badge status-3">已冻结</span>
      </div>
      <div class="divider"></div>
      <div class="bottom">
        <div class="points">积分 <span>1200</span></div>
        <div class="actions">
          <button class="btn btn-success">解冻</button>
          <button class="btn btn-outline">重置</button>
        </div>
      </div>
    </div>

    <div class="card card-user">
      <div class="top">
        <div class="avatar" style="background: linear-gradient(135deg, #ec4899, #db2777); box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">陈</div>
        <div class="info">
          <div class="name-row">
            <span class="name">陈静</span>
            <span class="badge badge-user">用户</span>
          </div>
          <div class="phone">136****3456</div>
        </div>
        <span class="status-badge status-1">待审核</span>
      </div>
      <div class="divider"></div>
      <div class="bottom">
        <div class="points">注册于 <span>2024-03-20</span></div>
        <div class="actions">
          <button class="btn btn-outline">重置</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
