<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风格C - 分组列表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      background: #f7f8fc;
      color: #1a1a2e;
    }
    .nav {
      background: #fff;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .section { margin: 12px; }
    .section-title {
      font-size: 12px;
      color: #8b8ba7;
      padding: 0 4px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .group {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid #f5f5f5;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #fafafa; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .body { flex: 1; min-width: 0; }
    .name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .meta { font-size: 12px; color: #8b8ba7; }
    .dot { margin: 0 4px; }
    .status { font-weight: 500; }
    .status-1 { color: #faad14; }
    .status-2 { color: #52c41a; }
    .status-3 { color: #ff4d4f; }
    .btn {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-warning { background: #fef3c7; color: #d97706; }
    .btn-success { background: #dcfce7; color: #16a34a; }
  </style>
</head>
<body>
  <div class="nav">用户管理</div>

  <div class="section">
    <div class="section-title">管理组</div>
    <div class="group">
      <div class="item">
        <div class="avatar">张</div>
        <div class="body">
          <div class="name">张伟</div>
          <div class="meta">138****1234<span class="dot">·</span><span class="status status-2">正常</span></div>
        </div>
        <button class="btn btn-primary">重置</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">店铺用户 (2)</div>
    <div class="group">
      <div class="item">
        <div class="avatar" style="background: linear-gradient(135deg, #f59e0b, #d97706);">李</div>
        <div class="body">
          <div class="name">李娜</div>
          <div class="meta">139****5678<span class="dot">·</span><span class="status status-2">正常</span><span class="dot">·</span>5200积分</div>
        </div>
        <button class="btn btn-warning">冻结</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">普通用户 (2)</div>
    <div class="group">
      <div class="item">
        <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669);">王</div>
        <div class="body">
          <div class="name">王芳</div>
          <div class="meta">137****9012<span class="dot">·</span><span class="status status-3">已冻结</span></div>
        </div>
        <button class="btn btn-success">解冻</button>
      </div>
      <div class="item">
        <div class="avatar" style="background: linear-gradient(135deg, #ec4899, #db2777);">陈</div>
        <div class="body">
          <div class="name">陈静</div>
          <div class="meta">136****3456<span class="dot">·</span><span class="status status-1">待审核</span></div>
        </div>
        <button class="btn btn-primary">重置</button>
      </div>
    </div>
  </div>
</body>
</html>
