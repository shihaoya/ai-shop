<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风格A - 简约列表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      background: #f7f8fc;
      color: #1a1a2e;
    }
    .nav {
      background: #fff;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .list { background: #fff; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .item:last-child { border-bottom: none; }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .body { flex: 1; min-width: 0; }
    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .name { font-size: 15px; font-weight: 600; }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .tag-1 { background: #fef2f2; color: #ef4444; }
    .tag-2 { background: #fef9c3; color: #ca8a04; }
    .tag-3 { background: #dbeafe; color: #3b82f6; }
    .meta { font-size: 12px; color: #8b8ba7; }
    .actions { display: flex; gap: 6px; }
    .btn {
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-warning { background: #fbbf24; color: #fff; }
    .btn-success { background: #34d399; color: #fff; }
  </style>
</head>
<body>
  <div class="nav">用户管理</div>
  <div class="list">
    <div class="item">
      <div class="avatar">张</div>
      <div class="body">
        <div class="name-row">
          <span class="name">张伟</span>
          <span class="tag tag-1">管理员</span>
        </div>
        <div class="meta">138****1234 · 正常</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary">重置</button>
      </div>
    </div>
    <div class="item">
      <div class="avatar" style="background: linear-gradient(135deg, #f59e0b, #d97706);">李</div>
      <div class="body">
        <div class="name-row">
          <span class="name">李娜</span>
          <span class="tag tag-2">店铺</span>
        </div>
        <div class="meta">139****5678 · 正常 · 5200积分</div>
      </div>
      <div class="actions">
        <button class="btn btn-warning">冻结</button>
        <button class="btn btn-primary">重置</button>
      </div>
    </div>
    <div class="item">
      <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669);">王</div>
      <div class="body">
        <div class="name-row">
          <span class="name">王芳</span>
          <span class="tag tag-3">用户</span>
        </div>
        <div class="meta">137****9012 · 已冻结 · 1200积分</div>
      </div>
      <div class="actions">
        <button class="btn btn-success">解冻</button>
        <button class="btn btn-primary">重置</button>
      </div>
    </div>
    <div class="item">
      <div class="avatar" style="background: linear-gradient(135deg, #ec4899, #db2777);">陈</div>
      <div class="body">
        <div class="name-row">
          <span class="name">陈静</span>
          <span class="tag tag-3">用户</span>
        </div>
        <div class="meta">136****3456 · 待审核</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary">重置</button>
      </div>
    </div>
  </div>
</body>
</html>
